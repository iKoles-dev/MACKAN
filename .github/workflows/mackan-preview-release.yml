name: Publish MACKAN preview app

on:
  push:
    branches:
      - mackan-native
  workflow_dispatch:
    inputs:
      app_version:
        description: Preview app version stamped into Info.plist
        required: true
        default: "0.1.0-preview.1"
      tag_name:
        description: Versioned GitHub prerelease tag to create or update
        required: true
        default: "v0.1.0-preview.1"
      update_preview_channel:
        description: Also update the moving mackan-preview channel release
        required: true
        type: boolean
        default: true
      preview_channel_tag:
        description: Moving preview channel tag
        required: true
        default: "mackan-preview"

permissions:
  contents: write

concurrency:
  group: mackan-preview-release
  cancel-in-progress: false

jobs:
  preview-release:
    name: Build and publish preview .app
    runs-on: macos-latest
    timeout-minutes: 90

    env:
      APP_NAME: MACKAN
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore NuGet cache
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve preview metadata
        shell: bash
        run: |
          set -euo pipefail

          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              APP_VERSION="${{ github.event.inputs.app_version }}"
              PREVIEW_TAG="${{ github.event.inputs.tag_name }}"
              UPDATE_PREVIEW_CHANNEL="${{ github.event.inputs.update_preview_channel }}"
              PREVIEW_CHANNEL_TAG="${{ github.event.inputs.preview_channel_tag }}"
              ;;
            *)
              APP_VERSION="0.1.0-preview.${GITHUB_RUN_NUMBER}"
              PREVIEW_TAG="mackan-preview"
              UPDATE_PREVIEW_CHANNEL="false"
              PREVIEW_CHANNEL_TAG="mackan-preview"
              ;;
          esac

          {
            echo "APP_VERSION=$APP_VERSION"
            echo "PREVIEW_TAG=$PREVIEW_TAG"
            echo "UPDATE_PREVIEW_CHANNEL=$UPDATE_PREVIEW_CHANNEL"
            echo "PREVIEW_CHANNEL_TAG=$PREVIEW_CHANNEL_TAG"
            echo "BUILD_ROOT=$RUNNER_TEMP/mackan-preview-build"
          } >> "$GITHUB_ENV"

      - name: Validate preview inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${APP_VERSION:-}" || ! "$APP_VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "APP_VERSION must look like 0.1.0-preview or 0.1.0-preview.123." >&2
            exit 1
          fi

          if [[ -z "${PREVIEW_TAG:-}" || ! "$PREVIEW_TAG" =~ ^[0-9A-Za-z._/-]+$ ]]; then
            echo "PREVIEW_TAG must be a non-empty git tag-safe value." >&2
            exit 1
          fi

          if [[ "$PREVIEW_TAG" != "mackan-preview" && "$PREVIEW_TAG" != "v$APP_VERSION" ]]; then
            echo "Versioned preview releases should use tag v$APP_VERSION." >&2
            exit 1
          fi

          if [[ "$UPDATE_PREVIEW_CHANNEL" != "true" && "$UPDATE_PREVIEW_CHANNEL" != "false" ]]; then
            echo "UPDATE_PREVIEW_CHANNEL must be true or false." >&2
            exit 1
          fi

          if [[ -z "${PREVIEW_CHANNEL_TAG:-}" || ! "$PREVIEW_CHANNEL_TAG" =~ ^[0-9A-Za-z._/-]+$ ]]; then
            echo "PREVIEW_CHANNEL_TAG must be a non-empty git tag-safe value." >&2
            exit 1
          fi

      - name: Build universal preview app
        id: build-app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(APP_VERSION="$APP_VERSION" BUILD_ROOT="$BUILD_ROOT" macosx/MACKAN/scripts/build-dev-app.sh --universal)"
          ZIP_PATH="$RUNNER_TEMP/MACKAN-${APP_VERSION}-macOS.app.zip"
          CHECKSUM_PATH="${ZIP_PATH}.sha256"

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"
          shasum -a 256 "$ZIP_PATH" > "$CHECKSUM_PATH"

          {
            echo "app_path=$APP_PATH"
            echo "zip_path=$ZIP_PATH"
            echo "checksum_path=$CHECKSUM_PATH"
            echo "zip_name=$(basename "$ZIP_PATH")"
            echo "checksum_name=$(basename "$CHECKSUM_PATH")"
          } >> "$GITHUB_OUTPUT"

      - name: Verify preview archive
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="${{ steps.build-app.outputs.zip_path }}"
          EXPAND_DIR="$RUNNER_TEMP/mackan-preview-expand"
          rm -rf "$EXPAND_DIR"
          mkdir -p "$EXPAND_DIR"

          ditto -x -k "$ZIP_PATH" "$EXPAND_DIR"
          test -d "$EXPAND_DIR/MACKAN.app"
          macosx/MACKAN/scripts/verify-app-bundle.sh \
            --mode universal \
            --require-icon \
            --require-version "$APP_VERSION" \
            "$EXPAND_DIR/MACKAN.app"

      - name: Write release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail

          NOTES_PATH="$RUNNER_TEMP/mackan-preview-release-notes.md"
          cat > "$NOTES_PATH" <<NOTES
          # MACKAN ${APP_VERSION}

          Native macOS CKAN mod management for Kerbal Space Program.

          ## Download

          Download both assets from this release:

          - \`${{ steps.build-app.outputs.zip_name }}\`
          - \`${{ steps.build-app.outputs.zip_name }}.sha256\`

          Verify the archive before opening it:

          \`\`\`bash
          shasum -a 256 -c ${{ steps.build-app.outputs.zip_name }}.sha256
          \`\`\`

          Then unzip \`${{ steps.build-app.outputs.zip_name }}\` and open \`MACKAN.app\`.

          ## Who should use this

          - Mac players and testers who want to try the native SwiftUI/AppKit CKAN workflow.
          - Contributors checking the current MACKAN app without building from Terminal.
          - Users comfortable opening an ad-hoc signed preview app.

          ## What to test

          - First launch, Gatekeeper open flow, and existing KSP instance detection.
          - Repository refresh, catalog browsing, search, filtering, and module details.
          - Install, remove, upgrade, recommendation, and change-apply preview flows.
          - File import/export, cache cleanup, registry repair, and settings workflows.
          - Sidecar health, diagnostics collection, and recovery from visible errors.

          ## Known release limitation

          - This preview is ad-hoc signed but not Developer ID signed or notarized yet.
          - If macOS blocks a normal double-click, use Finder right-click -> Open.
          - On newer macOS versions, use System Settings -> Privacy & Security -> Open Anyway.
          - A signed and notarized DMG remains a separate public-release gate.
          - This is a preview build for testing native macOS workflows, not an official CKAN release.

          ## Help and feedback

          - Install guide: https://github.com/iKoles-dev/MACKAN/blob/mackan-native/INSTALL.md
          - Troubleshooting: https://github.com/iKoles-dev/MACKAN/blob/mackan-native/docs/mackan/troubleshooting.md
          - Diagnostics and privacy: https://github.com/iKoles-dev/MACKAN/blob/mackan-native/docs/mackan/diagnostics-privacy.md
          - Feedback: https://github.com/iKoles-dev/MACKAN/issues/new/choose

          ## Build

          - Commit: \`${GITHUB_SHA}\`
          - Version: \`${APP_VERSION}\`
          - Versioned release: \`${PREVIEW_TAG}\`
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Website: https://ikoles-dev.github.io/MACKAN/
          NOTES

          echo "path=$NOTES_PATH" >> "$GITHUB_OUTPUT"

      - name: Update preview releases
        shell: bash
        run: |
          set -euo pipefail

          update_release() {
            local tag_name="$1"
            local release_title="$2"

            git tag -f "$tag_name" "$GITHUB_SHA"
            git push --force origin "refs/tags/$tag_name"

            if gh release view "$tag_name" >/dev/null 2>&1; then
              gh release edit "$tag_name" \
                --title "$release_title" \
                --notes-file "${{ steps.notes.outputs.path }}" \
                --prerelease
            else
              gh release create "$tag_name" \
                --target "$GITHUB_SHA" \
                --title "$release_title" \
                --notes-file "${{ steps.notes.outputs.path }}" \
                --prerelease
            fi

            gh release view "$tag_name" --json assets --jq '.assets[].name' \
              | grep -E '^MACKAN-.*-macOS[.]app[.]zip([.]sha256)?$' \
              | while IFS= read -r asset_name; do
                  [[ -n "$asset_name" ]] || continue
                  gh release delete-asset "$tag_name" "$asset_name" --yes || true
                done || true

            gh release upload "$tag_name" \
              "${{ steps.build-app.outputs.zip_path }}" \
              "${{ steps.build-app.outputs.checksum_path }}" \
              --clobber
          }

          if [[ "$PREVIEW_TAG" == "mackan-preview" ]]; then
            update_release "$PREVIEW_TAG" "MACKAN Preview Channel ($APP_VERSION)"
          else
            update_release "$PREVIEW_TAG" "MACKAN $APP_VERSION"
          fi

          if [[ "$UPDATE_PREVIEW_CHANNEL" == "true" && "$PREVIEW_CHANNEL_TAG" != "$PREVIEW_TAG" ]]; then
            update_release "$PREVIEW_CHANNEL_TAG" "MACKAN Preview Channel ($APP_VERSION)"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: MACKAN-${{ env.APP_VERSION }}-macOS-app
          path: |
            ${{ steps.build-app.outputs.zip_path }}
            ${{ steps.build-app.outputs.checksum_path }}
          if-no-files-found: error
